<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Un universo para ti 💛</title>

    <meta name="description" content="Una galaxia de flores amarillas. Toca cada flor para leer su carta.">
    <meta name="theme-color" content="#05060f">

    <!-- Para que se vea bonito al compartir el enlace por WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Un universo para ti 💛">
    <meta property="og:description" content="Una galaxia de flores amarillas. Toca cada flor para leer su carta.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         DIBUJO DE LA FLOR (se reutiliza en todas las flores)
         Un solo <symbol> y cada flor lo clona con <use>:
         cientos de flores sin repetir el dibujo en el HTML.
    ====================================================== -->

    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="petalos" viewBox="0 0 100 100">
            <ellipse cx="50" cy="27" rx="11.5" ry="23" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(45 50 50)" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(90 50 50)" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(135 50 50)" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(180 50 50)" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(225 50 50)" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(270 50 50)" />
            <ellipse cx="50" cy="27" rx="11.5" ry="23" transform="rotate(315 50 50)" />
        </symbol>
    </svg>


    <!-- ================= INTRO ================= -->

    <section id="intro">

        <div id="camara">
            <div id="warpEstrellas" aria-hidden="true"></div>
            <div id="warpParticulas" aria-hidden="true"></div>

            <div class="destino" aria-hidden="true">
                <div class="destino__brillo"></div>

                <div class="anillo anillo--1"></div>
                <div class="anillo anillo--2"></div>
                <div class="anillo anillo--3"></div>

                <div class="destino__flor">
                    <svg class="flor__svg" viewBox="0 0 100 100" aria-hidden="true"><use href="#petalos" /></svg>
                </div>
            </div>
        </div>

        <div class="intro__texto">
            <h1>Preparando un universo</h1>
            <p>hecho especialmente para ti 💛</p>
        </div>

        <button id="saltarIntro" type="button">Saltar</button>

        <div id="destello" aria-hidden="true"></div>
    </section>


    <!-- ================= UNIVERSO ================= -->

    <main id="universo" inert>

        <div class="nebulosa nebulosa--1" aria-hidden="true"></div>
        <div class="nebulosa nebulosa--2" aria-hidden="true"></div>
        <div class="nebulosa nebulosa--3" aria-hidden="true"></div>

        <!-- 3 capas de estrellas dibujadas con box-shadow desde JS -->
        <div id="cielo" aria-hidden="true">
            <div class="cielo__capa" data-capa="1"></div>
            <div class="cielo__capa" data-capa="2"></div>
            <div class="cielo__capa" data-capa="3"></div>
        </div>

        <header class="universo__titulo">
            <h1>Mi universo amarillo 💛</h1>
            <p>Hay una carta escondida en cada flor <br> Para Paulina Pulgarini</p>
        </header>

        <div id="galaxiaWrap">

            <div id="galaxia">
                <!-- flores de fondo y flores con carta: las genera script.js -->
                <div id="floresFondo" aria-hidden="true"></div>
                <div id="floresCarta"></div>
            </div>

            <button id="nucleo" type="button" disabled>
                <span class="nucleo__brillo" aria-hidden="true"></span>
                <span class="nucleo__flor" aria-hidden="true">
                    <svg class="flor__svg" viewBox="0 0 100 100" aria-hidden="true"><use href="#petalos" /></svg>
                </span>
                <span class="sr-only">Centro de la galaxia</span>
            </button>

        </div>

        <footer class="pie">
            <p class="pie__instruccion">Toca una flor</p>
            <p class="pie__progreso" id="progreso">0 de 12 cartas abiertas</p>
        </footer>

        <button id="botonMusica" type="button" aria-pressed="false">
            <span aria-hidden="true">🎵</span> Música
        </button>

        <noscript>
            <p class="aviso">Este regalo necesita JavaScript activado para mostrarse.</p>
        </noscript>

    </main>


    <!-- ================= CARTA ================= -->

    <div id="carta" role="dialog" aria-modal="true" aria-labelledby="cartaTitulo" inert>

        <article class="sobre">

            <button id="cerrarCarta" type="button" aria-label="Cerrar carta">×</button>

            <p class="sobre__icono" aria-hidden="true">💌</p>

            <h2 id="cartaTitulo">Una carta para ti</h2>

            <div class="sobre__linea" aria-hidden="true"></div>

            <!-- copia visible (se escribe letra por letra) -->
            <p id="cartaTexto" aria-hidden="true"></p>
            <!-- copia completa para lectores de pantalla -->
            <p id="cartaTextoAccesible" class="sr-only"></p>

            <p class="sobre__flor" aria-hidden="true">🌻</p>

            <p class="sobre__firma">Con cariño 💛</p>

        </article>
    </div>


    <audio id="musica" src="Fallen Star.mp3" loop preload="none"></audio>

    <script src="script.js"></script>

</body>

</html>
